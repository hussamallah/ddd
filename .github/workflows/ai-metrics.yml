name: AI Engineering Metrics

on:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of days to analyze'
        required: false
        default: '7'
        type: string

jobs:
  collect-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for metrics

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect AI Metrics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          npm run ai:metrics -- --days ${{ github.event.inputs.days || '7' }} --output reports

      - name: Upload metrics artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ai-metrics-${{ github.run_number }}
          path: reports/
          retention-days: 30

      - name: Commit and push reports
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add reports/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update AI metrics reports [skip ci]"
          git push

  weekly-report:
    needs: collect-metrics
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          name: ai-metrics-${{ needs.collect-metrics.outputs.run_id }}
          path: reports/

      - name: Generate weekly summary
        id: summary
        run: |
          if [ -f "reports/ai-metrics.json" ]; then
            # Extract key metrics for summary
            ACCEPTANCE_RATE=$(jq -r '.adoption.acceptanceRate * 100' reports/ai-metrics.json)
            REWORK_72H=$(jq -r '.quality.rework72h_pct' reports/ai-metrics.json)
            DEFECT_RATE=$(jq -r '.quality.defectIntroPer1k' reports/ai-metrics.json)
            BUILD_BREAKS=$(jq -r '.speed.buildBreaksPer1k' reports/ai-metrics.json)
            
            echo "acceptance_rate=$ACCEPTANCE_RATE" >> $GITHUB_OUTPUT
            echo "rework_72h=$REWORK_72H" >> $GITHUB_OUTPUT
            echo "defect_rate=$DEFECT_RATE" >> $GITHUB_OUTPUT
            echo "build_breaks=$BUILD_BREAKS" >> $GITHUB_OUTPUT
          else
            echo "acceptance_rate=N/A" >> $GITHUB_OUTPUT
            echo "rework_72h=N/A" >> $GITHUB_OUTPUT
            echo "defect_rate=N/A" >> $GITHUB_OUTPUT
            echo "build_breaks=N/A" >> $GITHUB_OUTPUT
          fi

      - name: Comment on recent PRs
        run: |
          # Find PRs merged in the last 7 days
          PRS=$(gh pr list --state merged --limit 10 --json number,title,url)
          
          if [ ! -z "$PRS" ]; then
            echo "$PRS" | jq -r '.[] | @base64' | while read -r pr; do
              PR_DATA=$(echo "$pr" | base64 --decode)
              PR_NUMBER=$(echo "$PR_DATA" | jq -r '.number')
              PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
              
              # Post weekly metrics summary comment
              gh pr comment $PR_NUMBER --body "## 📊 Weekly AI Engineering Metrics Summary
              
              **Period:** Last 7 days
              
              **Key Metrics:**
              - ✅ **Acceptance Rate:** ${{ steps.summary.outputs.acceptance_rate }}%
              - ⚠️ **Rework (72h):** ${{ steps.summary.outputs.rework_72h }}%
              - 🐛 **Defect Rate:** ${{ steps.summary.outputs.defect_rate }} per 1k lines
              - 🔨 **Build Breaks:** ${{ steps.summary.outputs.build_breaks }} per 1k lines
              
              📈 **Full Report:** [View detailed metrics](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              
              ---
              *Generated by AI Metrics Action*"
            done
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README badge
        run: |
          # Update README with current metrics status
          if [ -f "reports/ai-metrics.json" ]; then
            ACCEPTANCE_RATE=$(jq -r '.adoption.acceptanceRate * 100' reports/ai-metrics.json)
            REWORK_72H=$(jq -r '.quality.rework72h_pct' reports/ai-metrics.json)
            
            # Determine badge color based on metrics
            if (( $(echo "$ACCEPTANCE_RATE >= 80" | bc -l) )) && (( $(echo "$REWORK_72H <= 15" | bc -l) )); then
              BADGE_COLOR="brightgreen"
              BADGE_TEXT="AI%20Metrics%20Good"
            elif (( $(echo "$ACCEPTANCE_RATE >= 60" | bc -l) )) && (( $(echo "$REWORK_72H <= 25" | bc -l) )); then
              BADGE_COLOR="yellow"
              BADGE_TEXT="AI%20Metrics%20Warning"
            else
              BADGE_COLOR="red"
              BADGE_TEXT="AI%20Metrics%20Critical"
            fi
            
            # Update README if badge section exists
            if grep -q "AI Engineering Metrics" README.md; then
              sed -i "s|!\[AI Metrics\].*|![AI Metrics](https://img.shields.io/badge/$BADGE_TEXT-$BADGE_COLOR?style=flat&logo=github)|" README.md
            else
              # Add badge section to README
              echo "" >> README.md
              echo "## AI Engineering Metrics" >> README.md
              echo "" >> README.md
              echo "![AI Metrics](https://img.shields.io/badge/$BADGE_TEXT-$BADGE_COLOR?style=flat&logo=github)" >> README.md
              echo "" >> README.md
              echo "Weekly metrics tracking AI-assisted development performance. [View latest report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> README.md
            fi
            
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add README.md
            git diff --quiet && git diff --staged --quiet || git commit -m "Update AI metrics badge [skip ci]"
            git push
          fi
